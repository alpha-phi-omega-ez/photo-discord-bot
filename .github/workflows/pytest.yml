name: Pytest

on:
  pull_request:
    paths:
      - "**.py"
      - "uv.lock"
      - "pyproject.toml"
      - "Dockerfile"
      - ".python-version"
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "uv.lock"
      - "pyproject.toml"
      - "Dockerfile"
      - ".python-version"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: test-discord-token
      PARENT_FOLDER_ID: test-parent-folder-id
      CHANNEL_NAME: test-channel
      SHARED_DRIVE_ID: test-shared-drive-id
      GUILD_ID: "123456789"
      DELEGATE_EMAIL: bot@example.iam.gserviceaccount.com
      ROLE_NAME: test-role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest --cov=main -q

      - name: Import smoke check
        run: uv run python -c "import main"
